name: Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

on:
  workflow_dispatch:
  schedule:
    - cron: 0 */18 * * *

jobs:
  check:
    runs-on: ubuntu-latest
    # 【已添加】授权删除旧工作流运行历史的权限，避免 403
    permissions:
      actions: write

    steps:

    - name: Get Commit Hash
      id: getHash
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
        # 【已修改】使用官方最新的 GITHUB_OUTPUT 语法传递 Hash
        echo "commitHash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Compare Commit Hash
      id: cacheHash
      # 【已升级】升级为 actions/cache@v4
      uses: actions/cache@v4
      with:
        path: .commitHash
        # 【已修改】更换前缀避免沿用之前的旧脏缓存
        key: commitHash_${{ steps.getHash.outputs.commitHash }}

    - name: Save New Commit Hash
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        echo ${{ steps.getHash.outputs.commitHash }} | tee .commitHash

    - name: Trigger build
      if: steps.cacheHash.outputs.cache-hit != 'true'
      # 【已升级】升级为 Node 20 驱动的 peter-evans/repository-dispatch@v3
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        event-type: Source Code Update

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 1 # 只保留最新 1 个检查器运行历史
        delete_workflow_pattern: 'update-checker|Update Checker'
        token: ${{ secrets.GITHUB_TOKEN }}
